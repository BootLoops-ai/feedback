name: Bug in a script, package or data file
description: A downloadable script, package or data file does not work as described.
labels: ["bug"]
body:
  - type: input
    id: file
    attributes:
      label: File or package
      description: e.g. files/lss/lss-evaluate.py, JaCK & Jill 0.2.3, releases/cegm-x36
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What you ran and what happened
      description: Command, environment (OS, Python version), expected result, actual result, full error text
    validations:
      required: true
